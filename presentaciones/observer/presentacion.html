<script id="observer-data" type="application/json">{"notes":["Abrir con el ejemplo del curso: publica una novedad y la reciben los alumnos suscriptos. Observer es un patrón de comportamiento que establece una dependencia de uno a muchos. Recorrido sugerido: 6–8 minutos.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Observador.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Alumno.java","El curso necesita distribuir avisos a un grupo que cambia. El cliente administra las suscripciones; el curso conserva referencias del tipo Observador. No tiene que preguntar si el receptor es Alumno o alguna futura clase. No confundir desacoplamiento con ausencia de dependencias: Curso depende del contrato Observador.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Sujeto.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Observador.java","Sujeto y Observador son interfaces. Las líneas discontinuas con triángulo indican realización: Curso implementa Sujeto y Alumno implementa Observador. La asociación 1 a 0..* significa que un curso guarda cero o más observadores; no es composición, ya que el curso no es dueño de su ciclo de vida. Demo crea las instancias y las conecta. Se muestran los miembros relevantes; Curso implementa también los tres métodos de Sujeto.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Sujeto.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Observador.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Alumno.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Demo.java","Leer publicarAviso en Curso.java: valida el aviso, cambia el estado y llama a notificar. El contrato Observador recibe el aviso como argumento: es una entrega push. Suscribir no entrega automáticamente el último aviso. Los fragmentos son extractos del código real.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Observador.java","Precondición: Demo ya creó los objetos y suscribió a Ana y Luis. La secuencia está simplificada: se omiten retornos y barras de activación. publicarAviso y notificar son llamadas síncronas en el mismo hilo; actualizar de Ana termina antes de comenzar actualizar de Luis. Cada Alumno guarda el aviso y lo imprime.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Demo.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Alumno.java","Demo elimina la referencia de Luis de la colección del curso. Luego publica el segundo aviso. Solo Ana recibe actualizar. Luis sigue existiendo y conserva TP disponible como último aviso; desuscribir no borra su estado ni destruye el objeto. Las llamadas son síncronas.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Demo.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Alumno.java","En la versión HTML, usar Paso siguiente para recorrer Demo.java. Cada estado es una instantánea de la ejecución del código, no un servidor Java. Se separan las dos entregas del primer aviso para mostrar el orden síncrono. El estado final demuestra que Luis conserva el primer mensaje.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Demo.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Alumno.java","El método toma el aviso actual y una copia de los suscriptos. LinkedHashSet evita repetir la misma instancia y mantiene el orden de inserción. La copia permite que un observador se dé de baja durante la iteración. Altas y bajas no alteran los destinatarios de la ronda en curso. Capturar aviso conserva ese mensaje aunque un callback publique otro; aun así, una publicación anidada puede causar cascadas. No hay aislamiento de excepciones ni protección entre hilos.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java","Esta salida se obtuvo al compilar Observer con javac --release 17 -encoding UTF-8 -Xlint:all y ejecutar java -ea. Las aserciones verifican entrega, baja y preservación del estado de Luis. Otra instancia del curso prueba suscripción duplicada y un observador que se da de baja en su callback; también se prueba el rechazo de un aviso vacío. La ausencia de la segunda línea de Luis es deliberada. Mostrar Demo.java si se pregunta dónde se comprueba cada caso.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Demo.java","Usar Observer cuando varios receptores reaccionan a cambios de un sujeto y el conjunto de receptores cambia en ejecución. La ventaja aquí es agregar una nueva implementación de Observador sin cambiar Curso. Gestionar las bajas evita retener referencias innecesarias. Este código es de un solo hilo y las llamadas son síncronas; un observador lento demora los siguientes y una excepción interrumpe la ronda. No es una cola persistente ni promete entrega tras fallos. Cerrar volviendo a la evidencia: Luis ya no está suscripto y no recibe el segundo aviso.\n\nCódigo fuente (Patrones-Completos, cf8dbfc):\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Curso.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Observador.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Alumno.java\nhttps://github.com/jggaretto/Patrones-IngSoftware/blob/cf8dbfcc65b69772cd556e5074975085dd0e3d33/src/main/java/com/patronesingsoft/behavioral/Observer/Demo.java"],"frames":[{"code":"Crear Curso, Ana y Luis","members":[],"course":"","ana":"","luis":"","console":[],"explain":"Los objetos existen. Todavía no hay suscripciones ni avisos."},{"code":"curso.suscribir(ana)","members":["Ana"],"course":"","ana":"","luis":"","console":[],"explain":"El curso guarda una referencia a Ana como Observador."},{"code":"curso.suscribir(luis)","members":["Ana","Luis"],"course":"","ana":"","luis":"","console":[],"explain":"La colección conserva el orden de inserción: Ana, luego Luis."},{"code":"curso.publicarAviso(\"TP disponible\") → notificar()","members":["Ana","Luis"],"course":"TP disponible","ana":"","luis":"","console":[],"explain":"Se guarda el aviso. notificar captura el mensaje y copia los suscriptos."},{"code":"ana.actualizar(\"TP disponible\")","members":["Ana","Luis"],"course":"TP disponible","ana":"TP disponible","luis":"","console":["Ana recibio: TP disponible"],"to":"Ana","explain":"La primera llamada guarda el aviso en Ana y lo imprime."},{"code":"luis.actualizar(\"TP disponible\")","members":["Ana","Luis"],"course":"TP disponible","ana":"TP disponible","luis":"TP disponible","console":["Ana recibio: TP disponible","Luis recibio: TP disponible"],"to":"Luis","explain":"La segunda llamada actualiza a Luis. Finaliza la primera publicación."},{"code":"curso.desuscribir(luis)","members":["Ana"],"course":"TP disponible","ana":"TP disponible","luis":"TP disponible","console":["Ana recibio: TP disponible","Luis recibio: TP disponible"],"explain":"Luis sale de la colección. Su último aviso no se borra."},{"code":"curso.publicarAviso(\"Entrega: martes 06/10\") → notificar()","members":["Ana"],"course":"Entrega: martes 06/10","ana":"TP disponible","luis":"TP disponible","console":["Ana recibio: TP disponible","Luis recibio: TP disponible"],"explain":"El curso cambia su estado. La nueva copia de suscriptos contiene solo a Ana."},{"code":"ana.actualizar(\"Entrega: martes 06/10\")","members":["Ana"],"course":"Entrega: martes 06/10","ana":"Entrega: martes 06/10","luis":"TP disponible","console":["Ana recibio: TP disponible","Luis recibio: TP disponible","Ana recibio: Entrega: martes 06/10"],"to":"Ana","explain":"Ana recibe el segundo aviso. Luis conserva \"TP disponible\"."}],"frameSvgs":["\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1280 720\" role=\"img\" aria-label=\"Recorrido paso a paso\">\u003ctitle>Recorrido paso a paso\u003c/title>\u003crect width=\"1280\" height=\"720\" fill=\"#F5F2E9\"/>\u003ctext x=\"64\" y=\"97\" font-family=\"Segoe UI, Arial, sans-serif\" font-size=\"48\" font-weight=\"700\" fill=\"#193333\">\u003ctspan x=\"64\" dy=\"0\">Recorrido paso a paso\u003c/tspan>\u003c/text>\u003ctext x=\"64\" y=\"690\" font-family=\"Segoe UI, Arial, sans-serif\" font-size=\"16\" font-weight=\"400\" fill=\"#536B68\">\u003ctspan x=\"64\" dy=\"0\">OBSERVER · AVISOS DE UN CURSO\u003c/tspan>\u003c/text>\u003ctext x=\"1158\" y=\"690\" font-family=\"Segoe UI, Arial, sans-serif\" font-size=\"20\" font-weight=\"400\" fill=\"#536B68\">\u003ctspan x=\"1158\" dy=\"0\">07\u003c/tspan>\u003c/text>\u003ctext x=\"64\" y=\"170\" font-family=\"Consolas, monospace\" font-size=\"27\" font-weight=\"700\" fill=\"#087F6F\">\u003ctspan x=\"64\" dy=\"0\">Crear Curso, Ana y Luis\u003c/tspan>\u003c/text>\u003crect x=\"70\" y=\"238\ <script>
'use strict';
const data=JSON.parse(document.getElementById('observer-data').textContent);
const articles=[...document.querySelectorAll('article')];
let current=0,step=0;
const el=id=>document.getElementById(id);
const clamp=(n,max)=>Math.min(max,Math.max(0,n));
function show(n){current=clamp(n,articles.length-1);articles.forEach((a,i)=>a.classList.toggle('active',i===current));el('jump').value=current;el('prev').disabled=current===0;el('next').disabled=current===articles.length-1;el('count').textContent=(current+1)+' / '+articles.length;el('trace').classList.toggle('active',current===6);el('notes').textContent=data.notes[current];if(current===6)renderStep();}
function renderStep(){articles[6].innerHTML=data.frameSvgs[step];el('stepBack').disabled=step===0;el('stepNext').disabled=step===data.frames.length-1;el('stepCount').textContent='Estado '+(step+1)+' / '+data.frames.length;el('explain').textContent=data.frames[step].explain;el('state').textContent=data.frames[step].code+'. '+data.frames[step].explain;}
function moveStep(delta){step=clamp(step+delta,data.frames.length-1);renderStep();}
el('prev').onclick=()=>show(current-1);el('next').onclick=()=>show(current+1);el('jump').onchange=e=>show(Number(e.target.value));el('stepBack').onclick=()=>moveStep(-1);el('stepNext').onclick=()=>moveStep(1);el('reset').onclick=()=>{step=0;renderStep();};
el('notesButton').onclick=()=>{el('notes').hidden=!el('notes').hidden;el('notesButton').setAttribute('aria-pressed',String(!el('notes').hidden));};
el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{el('count').textContent='El navegador no permite pantalla completa.';}};
document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')show(current+1);else if(e.key==='ArrowLeft')show(current-1);else if(e.code==='Space'){e.preventDefault();if(current===6&&step<data.frames.length-1)moveStep(1);else show(current+1);}else if(e.key.toLowerCase()==='r'&&current===6){step=0;renderStep();}});
const printSvg=articles[6].innerHTML;window.addEventListener('beforeprint',()=>articles[6].innerHTML=printSvg);window.addEventListener('afterprint',()=>{if(current===6)renderStep();});
function observerSelfCheck(){const last=data.frames.at(-1);if(articles.length!==10||last.members.join()!=='Ana'||last.ana!=='Entrega: martes 06/10'||last.luis!=='TP disponible'||last.console.length!==3||clamp(-1,8)!==0||clamp(10,8)!==8)throw new Error('Falló la comprobación de Observer');return 'OK: 10 diapositivas, recorrido y límites de navegación';}
observerSelfCheck();show(0);
</script></body></html>
